  <script>
    const tl = gsap.timeline({ paused: true });
    const T = window.YA_T, S = T.scenes, END = T.total;
    const W = (n, w) => T.words[n].find((v) => v[0].toLowerCase().startsWith(w.toLowerCase()))[1];
    const LN = (n) => T.lines[n];
    const ALL = ["#dim", "#title", "#wifi", "#ctr", "#sen1", "#sen2", "#real", "#f1", "#f2", "#f3", "#s-fakta", "#tg", "#s-tg", "#k99", "#s-99", "#hose", "#sh0", "#sh1", "#s-sh", "#p2", "#tag", "#fol", "#flash"];
    gsap.set(ALL, { opacity: 0 });
    const show = (sel, a, b, from = { y: 30, scale: 0.92 }) => {
      tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "back.out(2)", immediateRender: false }, a);
      if (b !== undefined) tl.to(sel, { opacity: 0, duration: 0.18, ease: "power2.in" }, b - 0.18);
    };
    // ---- A<->B cut flashes
    ["minit", "tidur", "jam", "dompet", "fakta", "sehari", "bandar", "awan", "kabel", "jerung", "sauh", "akhir"].forEach((id) => {
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.07, immediateRender: false }, S[id] - 0.12);
      tl.to("#flash", { opacity: 0, duration: 0.22 }, S[id] - 0.05);
    });
    // ---- hook
    show("#title", 0.15, LN(2)[0] + 2.2, { y: -30, scale: 0.9 });
    show("#wifi", W(1, "WiFi") - 0.1, LN(1)[1] + 0.2, { scale: 0.3, y: 0 });
    gsap.set("#wifi-x", { strokeDasharray: 240, strokeDashoffset: 240 });
    tl.to("#wifi-x", { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, W(1, "hilang"));
    tl.to("#wifi", { rotation: 8, duration: 0.06, yoyo: true, repeat: 5 }, W(1, "hilang"));
    // ---- counter (text is a function of time)
    show("#ctr", 0.1, S.kabel, { y: -40, scale: 0.9 });
    const pad = (n) => String(Math.floor(n)).padStart(2, "0");
    function ctrText(t) {
      if (t < S.minit) return "00:00:" + pad(t);
      if (t < S.tidur) return "00:01:" + pad((t - S.minit) * 2);
      if (t < S.jam) return "00:2" + Math.floor((t - S.tidur)) + ":" + pad(((t - S.tidur) * 17) % 60);
      if (t < S.dompet) return "01:0" + Math.floor((t - S.jam) / 2) + ":" + pad(((t - S.jam) * 23) % 60);
      if (t < S.fakta) return "01:3" + Math.floor((t - S.dompet)) + ":" + pad(((t - S.dompet) * 29) % 60);
      if (t < S.sehari) return "06:00:00";
      if (t < S.bandar) return "1" + Math.min(9, 2 + Math.floor((t - S.sehari) * 2)) + ":00:00";
      if (t < LN(11)[0] - 0.1) return "HARI 1";
      return "HARI 7";
    }
    const val = document.querySelector("#ctr-val");
    tl.to({ p: 0 }, { p: 1, duration: END, ease: "none", onUpdate() { val.textContent = ctrText(tl.time()); } }, 0);
    [S.minit, S.jam, S.fakta, S.sehari, S.bandar, LN(11)[0] - 0.1].forEach((t) => {
      tl.fromTo("#ctr-box", { scale: 1 }, { scale: 1.16, duration: 0.1, ease: "power2.out", immediateRender: false }, t);
      tl.to("#ctr-box", { scale: 1, duration: 0.35, ease: "back.out(3)" }, t + 0.1);
    });
    // ---- scenario labels
    show("#sen1", W(5, "QR") - 0.2, S.dompet);
    show("#sen2", W(10, "Tiket") - 0.2, S.awan);
    // ---- fakta: dim the city, three facts
    tl.fromTo("#dim", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, S.fakta);
    tl.to("#dim", { opacity: 0, duration: 0.2 }, S.telegram - 0.2);
    show("#real", W(7, "pernah") - 0.1, S.telegram);
    show("#f1", W(7, "Tahun") - 0.1, S.telegram, { x: -80, y: 0 });
    show("#f2", W(7, "hampir") - 0.1, S.telegram, { x: 80, y: 0 });
    show("#f3", W(7, "Tiga") - 0.1, S.telegram, { x: -80, y: 0 });
    show("#s-fakta", W(7, "Tahun"), S.telegram, { y: 0 });
    // ---- telegram counter climbs to 70
    show("#tg", W(8, "tujuh") - 0.2, S.sehari);
    show("#s-tg", W(8, "tujuh"), S.sehari, { y: 0 });
    const tgn = document.querySelector("#tg-n"), tg0 = W(8, "tujuh") - 0.1, tg1 = W(8, "Telegram!");
    tl.to({ p: 0 }, { p: 1, duration: END, ease: "none", onUpdate() { const k = Math.max(0, Math.min(1, (tl.time() - tg0) / (tg1 - tg0))); tgn.textContent = String(Math.round(70 * (1 - Math.pow(1 - k, 2)))); } }, 0);
    // ---- kabel
    show("#k99", W(13, "sembilan") - 0.15, W(13, "Saiz") - 0.25, { scale: 0.6, y: 0 });
    show("#s-99", W(13, "sembilan"), W(13, "Saiz") - 0.25, { y: 0 });
    show("#hose", W(13, "Saiz") + 0.2, S.jerung);
    // ---- sauh
    show("#sh0", W(15, "kosong") - 0.15, W(15, "sauh") - 0.15);
    show("#sh1", W(15, "sauh") - 0.1, W(15, "terputus") - 0.2);
    show("#s-sh", W(15, "kosong"), W(15, "terputus") - 0.2, { y: 0 });
    // ---- akhir
    show("#p2", S.akhir + 0.1, END + 1);
    show("#tag", W(16, "Follow") - 0.6, END + 1, { y: 0 });
    show("#fol", W(16, "Follow") - 0.1, END + 1, { scale: 0.4, y: 0 });
    tl.to("#fol", { scale: 1.08, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, W(16, "Follow") + 0.4);
    window.__timelines["hud"] = tl;
  </script>
