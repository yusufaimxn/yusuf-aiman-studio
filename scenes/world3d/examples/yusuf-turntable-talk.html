<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0B1E3F; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0B1E3F; }
  #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="9" data-fps="30">
  <canvas id="stage" class="clip" data-start="0" data-duration="9" data-track-index="0" width="1080" height="1920"></canvas>
  <audio id="vo" class="clip" data-start="3" data-duration="6" data-track-index="1" src="assets/01.mp3"></audio>
</div>
<script src="assets/lib/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.to({}, { duration: 9 });
  window.__timelines["main"] = tl;
</script>
<script type="module">
import * as THREE from "./assets/lib/three.module.js";
import { buildCharacter, YUSUF, POSES } from "./assets/lib/character.js";
import { CUES } from "./assets/lib/visemes.js";

const clamp01 = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;

const canvas = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#f3e4d8");
const camera = new THREE.PerspectiveCamera(30, 1080 / 1920, 0.1, 50);

scene.add(new THREE.HemisphereLight("#eaf4ff", "#8a7f86", 1.1));
const key = new THREE.DirectionalLight("#ffe6c9", 2.4);
key.position.set(-2.5, 4.5, 4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2, right: 2, top: 3, bottom: -1, near: 0.5, far: 15 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight("#00C2FF", 1.6); rim.position.set(2.5, 3, -3.5); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 64), new THREE.MeshStandardMaterial({ color: "#efdccd", roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(12, 8), new THREE.MeshStandardMaterial({ color: "#f3e4d8", roughness: 0.95 }));
wall.position.set(0, 4, -3); wall.receiveShadow = true; scene.add(wall);

const y = buildCharacter(THREE, YUSUF);
scene.add(y.root);

const visemeAt = (t) => { let v = "X"; for (const [s, val] of CUES) { if (s <= t) v = val; else break; } return v; };
const blinkAt = (t) => { for (const b of [0.9, 2.6, 4.1, 6.3, 8.2]) { const k = (t - b) / 0.16; if (k >= 0 && k <= 1) return Math.sin(k * Math.PI); } return 0; };
const merge = (a, b, w) => { const out = {}; for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) { const p = a[k] || [0, 0, 0], q = b[k] || [0, 0, 0]; out[k] = p.map((v, i) => lerp(v, q[i], w)); } return out; };

function renderAt(t) {
  y.resetPose();
  // 0-3 s: turntable; 3-9 s: faces camera and talks with gestures
  const turn = t < 3 ? (t / 3) * Math.PI * 2 : 0;
  y.root.rotation.y = turn;
  let p = POSES.idle;
  if (t >= 3) {
    const g1 = ease((t - 3.3) / 0.6) * (1 - ease((t - 5.6) / 0.6));
    const g2 = ease((t - 5.8) / 0.6) * (1 - ease((t - 8.0) / 0.6));
    p = merge(POSES.idle, POSES.explain, g1);
    p = merge(p, POSES.present, g2);
  }
  y.pose(p, 1);
  // breathing + subtle weight shift
  y.joints.chest.rotation.x += 0.02 * Math.sin(t * 2.2);
  y.joints.hips.rotation.z += 0.015 * Math.sin(t * 0.9);
  y.joints.head.rotation.y += 0.05 * Math.sin(t * 0.7);
  const talking = t >= 3 && t < 9;
  y.face({ expression: t < 3 ? "neutral" : (t < 6 ? "happy" : "confident"), viseme: talking ? visemeAt(t - 3) : "X", blink: blinkAt(t) });
  // camera: full body during turntable, eases into a medium shot for the talk
  const k = ease((t - 2.8) / 1.0);
  camera.position.set(lerp(0, 0.25, k), lerp(1.05, 1.35, k), lerp(5.6, 3.0, k));
  camera.lookAt(0, lerp(0.88, 1.22, k), 0);
  renderer.render(scene, camera);
}
window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
renderAt(0);
</script>
</body>
</html>
